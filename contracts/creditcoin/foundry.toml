[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
via_ir = true
libs = ["../../node_modules"]

remappings = [
  "@gluwa/usc-contracts/=../../node_modules/@gluwa/usc-contracts/"
]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
sort_imports = true
