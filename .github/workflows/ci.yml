name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm secret-scan
      - run: pnpm secret-scan:test
      - run: pnpm public-boundary:check
      - run: pnpm agent-evidence:test
      - run: pnpm submit-quote:test
      - run: pnpm audit --prod

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --root contracts/source
      - run: forge test --root contracts/creditcoin
      - run: forge fmt --check --root contracts/source
      - run: forge fmt --check --root contracts/creditcoin

  browser-smoke:
    needs: javascript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --upgrade playwright
      - run: python -m playwright install --with-deps chromium
      - name: Start the local web app
        run: corepack pnpm dev > /tmp/loomcredit-web.log 2>&1 &
      - name: Wait for the local web app
        run: curl --fail --retry 30 --retry-delay 1 http://localhost:3000/
      - run: python scripts/browser-smoke.py
